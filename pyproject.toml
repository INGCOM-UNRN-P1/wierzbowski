[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wierzbowski"
version = "0.1.0"
description = "Auditor de grafos de inclusión de headers, dependencias circulares y Makefiles en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
wierzbowski = "wierzbowski.cli:app"

[project.entry-points."ripley.plugins"]
headers_audit = "wierzbowski.plugins.ripley_plugin:WierzbowskiPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
